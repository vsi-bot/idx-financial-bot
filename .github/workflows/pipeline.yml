name: IDX Financial Bot

on:
  schedule:
    # Setiap 15 menit, pukul 07.00 - 17.30 WIB (= 00.00 - 10.30 UTC)
    - cron: "*/15 0-9 * * *"
    - cron: "0,15,30 10 * * *"
  repository_dispatch:
    types: [inbox]                  # dipicu Apps Script saat ada file baru di Inbox (07.00 - 17.30 WIB)
  workflow_dispatch:                # tombol "Run workflow" manual (kapan saja)
    inputs:
      tickers:
        description: "Proses ulang emiten tertentu (pisahkan koma, mis. AADI,BRIS). Kosongkan jika tidak perlu."
        required: false
        default: ""
      force:
        description: "Paksa hitung ulang & kirim ulang narasi"
        type: boolean
        default: false
      periods:
        description: "Periode yang dikirim ulang bersama 'force' (mis. 3Q26)"
        required: false
        default: ""
      force_scrape:
        description: "Paksa scraper IDX jalan sekarang (hanya jika scraper diaktifkan)"
        type: boolean
        default: false

concurrency:
  group: idx-financial-bot          # hanya satu proses berjalan dalam satu waktu
  cancel-in-progress: false

env:
  DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
  GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
  BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    name: Bot 1 - Kumpulkan laporan
    runs-on: ${{ vars.COLLECTOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      tickers: ${{ steps.collect.outputs.tickers }}
      outbox: ${{ steps.collect.outputs.outbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: collect
        env:
          FORCE_SCRAPE: ${{ inputs.force_scrape && 'true' || 'false' }}
        run: python main.py collect --extra "${{ inputs.tickers }}"

  process:
    name: Bot 2 & 3 - ${{ matrix.ticker }}
    needs: collect
    if: needs.collect.outputs.tickers != '' && needs.collect.outputs.tickers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5               # hingga 5 emiten dihitung bersamaan
      matrix:
        ticker: ${{ fromJson(needs.collect.outputs.tickers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py process --tickers ${{ matrix.ticker }} ${{ inputs.force && '--force' || '' }} --periods "${{ inputs.periods }}"

  send:
    name: Bot 3 - Kirim ke Discord (berurutan per emiten)
    needs: [collect, process]
    if: always() && needs.collect.result == 'success' && (needs.collect.outputs.tickers != '[]' || needs.collect.outputs.outbox == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py send
