# ============================================================
# Pengelompokan komponen agar tabel ringkas.
# Setiap kelompok berisi kata kunci; komponen yang namanya mengandung kata kunci
# masuk ke kelompok itu. Urutan berpengaruh: pencocokan pertama yang dipakai.
# Yang tidak cocok dengan kelompok mana pun masuk "Lainnya".
# ============================================================
