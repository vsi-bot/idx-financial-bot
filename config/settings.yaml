# ============================================================
# Pengaturan utama bot. Aman diubah tanpa menyentuh kode.
# Nilai rahasia (token, webhook, ID folder) TIDAK ditaruh di sini,
# melainkan di GitHub Secrets.
# ============================================================

folders:
  inbox: "Inbox"
  unknown: "_Tidak Dikenali"
  emiten: "Emiten"
  system: "_Sistem"
  period_format: "Financial Update - {label}"   # {label} -> 1Q26, 2Q26, 3Q26, FY25

data:
  start_year: 2025            # data ditarik mulai 1Q25
  narrate_from: "3Q26"        # narasi hanya untuk periode ini dan sesudahnya

scraper:
  enabled: false              # prioritas kedua: Inbox adalah jalur utama. Ubah ke true untuk mengaktifkan.
  min_interval_minutes: 60    # walau bot jalan tiap 15 menit, IDX dicek maks. sekali per jam
  base_url: "https://www.idx.co.id"
  report_page: "/id/perusahaan-tercatat/laporan-keuangan-dan-tahunan/"
  api_path: "/primary/ListedCompany/GetFinancialReport"
  index_from: 1
  page_size: 100
  delay_min: 4
  delay_max: 9
  headless: true
  offseason_interval_hours: 12  # di luar musim laporan, scraper jalan maks. tiap 12 jam
  # Musim laporan: scraper jalan setiap kali workflow berjalan (tiap 2 jam)
  seasons:                      # [bulan-tanggal mulai, bulan-tanggal selesai]
    - ["03-01", "05-10"]        # laporan tahunan + 1Q
    - ["07-10", "09-05"]        # 2Q
    - ["10-10", "11-15"]        # 3Q

discord:
  attach_excel: false       # true = lampirkan file Excel di pesan Discord
  status_messages: false      # pesan status tidak dikirim ke Discord, hanya dicatat di _Sistem/log

analysis:
  # Ambang batas yang dipakai mesin narasi
  strong_growth_pct: 15       # pertumbuhan >= 15% disebut solid
  flat_band_pct: 3            # -3% s.d. +3% disebut relatif stabil
  margin_move_bps: 100        # perubahan margin >= 100 bps dianggap material
  tax_jump_pp: 3              # kenaikan tarif pajak efektif >= 3 poin persen ditandai

theme:
  # Warna tema (kode hex tanpa #). Merah Victoria Sekuritas Indonesia.
  header: "C00000"          # latar header tabel
  header_growth: "8B0000"   # latar header kolom YoY/QoQ
  growth_fill: "FDECEC"     # latar sel kolom YoY/QoQ
  section_text: "C00000"    # warna judul bagian

table:
  max_groups: 4             # maksimal kelompok per pos, sisanya digabung ke "Lainnya"
  min_share: 0.02           # kelompok < 2% dari total digabung ke "Lainnya"

validation:
  pass_pct: 0.5               # selisih <= 0,5%  -> PASS
  fail_pct: 3.0               # selisih 0,5-3%   -> WARN (tetap dikirim); > 3% -> FAIL (tidak dikirim)
  other_share_warn: 0.25      # baris "Others" > 25% dari totalnya -> WARN (pos mungkin terlewat)
  rounding_note_pct: 3.0      # beda % (dari angka dibulatkan vs presisi penuh) > 3% relatif -> diberi catatan

anomaly:
  cost_qoq_pct: 15            # pos biaya bergerak lebih dari +/-15% QoQ
  margin_lookback_quarters: 4 # margin di luar rentang 4 kuartal terakhir

inbox:
  max_files_per_run: 60       # sisa file diproses pada putaran berikutnya

narrative:
  flat_pct: 1                 # |x| < 1%  -> stabil
  thin_pct: 5                 # 1-5%      -> tipis/moderat
  solid_pct: 15               # 5-15%     -> solid; > 15% -> kuat
  margin_flat_bps: 50         # perubahan margin < 50 bps -> stabil
  bridge_gap_pp: 5            # jembatan laba bila selisih pertumbuhan > 5 pp (atau ada n.m.)
  base_effect_qoq_pct: 30     # |QoQ| > 30% -> sebut YoY + kemungkinan efek basis
  incremental_min_pct: 2      # analisis inkremental bila delta pendapatan > 2%
  immaterial_pct: 1           # pos < 1% pendapatan tidak dikutip pertumbuhannya
  driver_main_share: 0.5      # > 50% kontribusi searah -> penggerak utama
  oneoff_pbt_share: 0.10      # pos sekali jadi: >= 10% |PBT| ...
  oneoff_jump: 1.5            # ... dan >= 1,5x periode pembanding
  inorganic_asset_jump: 0.30  # aset tumbuh > 30% YoY -> sebut kemungkinan anorganik
oneoff:
  groups: ["Selisih kurs", "Penjualan aset & nilai wajar", "Penurunan nilai", "Lainnya",
           "Pemulihan aset dihapusbukukan", "Treasury & selisih kurs"]
  exceptions:                 # pos yang rutin bagi emiten tertentu (tidak dianggap sekali jadi)
    ASII: ["Bagian laba entitas asosiasi/ventura"]
    BBRI: ["Pemulihan aset dihapusbukukan"]
review:
  auto_ok_templates: ["general", "bank", "bank_sharia"]   # selain ini: tahan untuk ditinjau sekali

growth:
  near_zero_pct: 1            # |basis| < 1% dari pos induk -> n.m.
  net_extreme_pct: 500        # pos net (non-operasi, laba segmen) dengan growth > 500% -> n.m.
